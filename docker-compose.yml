# Sobe a stack completa do CliNiv para uso local/demo: banco de dados,
# API (cliniv-api) e UI (este repositório).
#
# Pré-requisito: este repositório (cliniv-ui) e o cliniv-api devem estar
# clonados lado a lado, ex:
#   ~/git/cliniv-ui
#   ~/git/cliniv-api
#
# Uso:
#   docker compose up --build
#   UI em http://localhost:4200 · API em http://localhost:8080
#
# O schema do banco é criado e migrado automaticamente pelo Liquibase
# quando a API sobe (ver src/main/resources/db/changelog em cliniv-api) —
# não precisa de nenhum script manual.
#
# Usuário seed: ADMIN (senha definida no changeset de seed do banco —
# redefina pelo fluxo "Esqueci a senha" se não souber a senha original).
#
# Valores de senha/segredo abaixo são apenas para uso local — nunca use
# em produção.

services:
  db:
    image: mariadb:10.10
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: cliniv
      MARIADB_USER: admin
      MARIADB_PASSWORD: admin
    ports:
      # Publicado em 3307 no host (não 3306) para não colidir com um
      # MariaDB/MySQL local já rodando. A comunicação entre os
      # containers (api -> db) usa a porta interna 3306 normalmente.
      - "3307:3306"
    volumes:
      - cliniv-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../cliniv-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_BASE: jdbc:mariadb://db:3306/cliniv
      DB_USER: admin
      DB_PASSWORD: admin
      JWT_SECRET: local-docker-dev-secret-troque-em-producao
      SMTP_HOST: ""
      SMTP_PORT: ""
      SMTP_MAIL_USERNAME: ""
      SMTP_MAIL_PASSWORD: ""
    ports:
      - "8080:8080"

  ui:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  cliniv-db-data:
