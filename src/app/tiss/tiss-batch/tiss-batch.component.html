<div class="main-content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header card-header-info">
                        <h4 class="card-title">Lotes TISS</h4>
                        <p class="card-category">Gerenciar lotes de faturamento por convênio</p>
                    </div>
                    <div class="card-body">
                        <form #form="ngForm" autocomplete="off">
                            <div class="row">
                                <div class="col-md-2">
                                    <mat-form-field>
                                        <input matInput placeholder="ID Operadora [ENTER]" name="healthOperatorId"
                                            [(ngModel)]="filters.healthOperatorId" type="number"
                                            (keypress)="enterKeyPress($event)" />
                                    </mat-form-field>
                                </div>
                                <div class="col-md-2">
                                    <mat-form-field>
                                        <input matInput placeholder="Mês [ENTER]" name="referenceMonth"
                                            [(ngModel)]="filters.referenceMonth" type="number" min="1" max="12"
                                            (keypress)="enterKeyPress($event)" />
                                    </mat-form-field>
                                </div>
                                <div class="col-md-2">
                                    <mat-form-field>
                                        <input matInput placeholder="Ano [ENTER]" name="referenceYear"
                                            [(ngModel)]="filters.referenceYear" type="number"
                                            (keypress)="enterKeyPress($event)" />
                                    </mat-form-field>
                                </div>
                                <div class="col-md-2">
                                    <mat-form-field>
                                        <mat-label>Status</mat-label>
                                        <mat-select name="status" [(ngModel)]="filters.status">
                                            <mat-option [value]="null">Todos</mat-option>
                                            <mat-option *ngFor="let s of tissBatchStatuses" [value]="s.value">
                                                {{s.label}}
                                            </mat-option>
                                        </mat-select>
                                    </mat-form-field>
                                </div>
                            </div>
                            <button mat-raised-button type="button" (click)="applyFilter()"
                                class="col-12 col-sm-12 col-md-4 col-lg-3 btn btn-danger pull-right"
                                matTooltip="Aplica Filtro">
                                <span class="fa fa-search"></span> Filtrar</button>
                            <button mat-raised-button type="button" (click)="openDialog(null)"
                                matTooltip="Novo lote TISS"
                                class="col-12 col-sm-12 col-md-4 col-lg-3 btn btn-info pull-right"><span
                                    class="fa fa-plus"></span> Novo Lote</button>
                            <div class="clearfix"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <app-data-table [items]="datas" [columns]="columns" [loading]="loading" [dataNotFound]="dataNotFound"
            emptyMessage="Nenhum lote TISS encontrado..." [length]="page.totalElements"
            [pageIndex]="pageSettings.page" [pageSize]="pageSettings.size" (page)="onPageChange($event)"
            [sortActive]="pageSettings.orderBy || ''"
            [sortDirection]="pageSettings.direction ? pageSettings.direction.toLowerCase() : ''"
            (sortChange)="onSortChange($event)" (rowClick)="openDialog($event)">
        </app-data-table>
    </div>
</div>
<app-loading [show]="loading"></app-loading>
