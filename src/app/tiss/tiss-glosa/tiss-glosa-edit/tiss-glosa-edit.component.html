<div class="card">
    <div class="card-header card-header-info">
        <h4 class="card-title">Glosa TISS</h4>
        <p class="card-category">Contestação de lançamento financeiro</p>
    </div>
    <div class="card-body">
        <form #form="ngForm" autocomplete="off">
            <div class="row">
                <div class="col-md-2">
                    <mat-form-field>
                        <input matInput placeholder="ID" name="id" [(ngModel)]="dataToForm.id" #id disabled />
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <mat-form-field>
                        <mat-label>ID Lote TISS *</mat-label>
                        <input matInput type="number" name="tissBatchId"
                            [(ngModel)]="dataToForm.tissBatchId" required />
                    </mat-form-field>
                </div>
                <div class="col-md-4">
                    <mat-form-field>
                        <mat-label>ID Lançamento Financeiro *</mat-label>
                        <input matInput type="text" name="financialReleaseId"
                            [(ngModel)]="dataToForm.financialReleaseId" required />
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <mat-form-field>
                        <mat-label>Motivo da Glosa *</mat-label>
                        <textarea matInput name="reason" [(ngModel)]="dataToForm.reason" rows="3" required></textarea>
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <mat-form-field>
                        <mat-label>Valor Contestado (R$) *</mat-label>
                        <span matPrefix>R$ </span>
                        <input matInput type="number" name="contestedValue"
                            [(ngModel)]="dataToForm.contestedValue" step="0.01" required />
                    </mat-form-field>
                </div>
                <div class="col-md-4">
                    <mat-form-field>
                        <mat-label>Percentual (%)</mat-label>
                        <span matSuffix>%</span>
                        <input matInput type="number" name="contestedPercentage"
                            [(ngModel)]="dataToForm.contestedPercentage" step="0.01" />
                    </mat-form-field>
                </div>
            </div>
            <app-dialog-form-actions [showNew]="!!dataToForm.id" newLabel="Nova Glosa"
                newTooltip="Adiciona glosa" [saveDisabled]="!form.valid"
                (new)="resetForm()"
                (cancel)="onCancelClick()" (save)="save()"></app-dialog-form-actions>
            <div class="clearfix"></div>
        </form>
    </div>
</div>
<app-loading [show]="loading"></app-loading>
