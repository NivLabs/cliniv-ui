<h1 mat-dialog-title>Cadastro rápido de paciente</h1>
<div mat-dialog-content>
    <form #form="ngForm" autocomplete="off">
        <div class="row">
            <div class="col-md-12">
                <mat-form-field>
                    <input matInput placeholder="Nome completo" name="fullName" [(ngModel)]="dataToForm.fullName"
                        #fullName="ngModel" type="text" required />
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <mat-form-field>
                    <input matInput placeholder="Telefone" name="principalNumber"
                        [(ngModel)]="dataToForm.principalNumber" #principalNumber="ngModel" type="text" required />
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <mat-checkbox name="isMinor" [(ngModel)]="dataToForm.isMinor">Paciente é menor de idade</mat-checkbox>
            </div>
        </div>
        <div class="row" *ngIf="dataToForm.isMinor">
            <div class="col-md-12">
                <mat-form-field>
                    <input matInput placeholder="Nome do responsável" name="guardianName"
                        [(ngModel)]="dataToForm.guardianName" #guardianName="ngModel" type="text" required />
                </mat-form-field>
            </div>
        </div>
    </form>
</div>
<div mat-dialog-actions class="card-footer">
    <button mat-button (click)="onCancelClick()">Cancelar</button>
    <button mat-button class="btn btn-info"
        [disabled]="!form.valid || (dataToForm.isMinor && !dataToForm.guardianName)" (click)="save()">Cadastrar</button>
</div>
<app-loading [show]="loading"></app-loading>
