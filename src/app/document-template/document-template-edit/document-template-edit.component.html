<div class="card">
    <div class="card-header card-header-info">
        <h4 class="card-title">Dados do modelo</h4>
        <p class="card-category">Dados completos do modelo de documento</p>
    </div>
    <div class="card-body">
        <mat-tab-group>
            <mat-tab label="Informações do modelo de documento *">
                <br />
                <form #form="ngForm" autocomplete="off">
                    <div class="row">
                        <div class="col-md-3">
                            <mat-form-field>
                                <input matInput placeholder="Código do modelo" name="id"
                                    [(ngModel)]="dataToForm.id" #id disabled />
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <mat-form-field>
                                <input matInput placeholder="Descrição do modelo" name="description"
                                    [(ngModel)]="dataToForm.description" #description required />
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <mat-form-field>
                                <textarea matInput
                                    cdkTextareaAutosize="true" 
                                    cdkAutosizeMinRows="30"
                                    [(ngModel)]="dataToForm.text"
                                    [ngModelOptions]="{standalone: true}"></textarea>
                            </mat-form-field>
                        </div>
                    </div>
                    <app-dialog-form-actions [showNew]="!!dataToForm.id" newLabel="Novo modelo"
                        newTooltip="Adicionar modelo" [saveDisabled]="!form.valid" (new)="resetForm()"
                        (cancel)="onCancelClick()" (save)="save()"></app-dialog-form-actions>
                    <div class="clearfix"></div>
                </form>
            </mat-tab>
        </mat-tab-group>
    </div>
</div>
<app-loading [show]="loading"></app-loading>
