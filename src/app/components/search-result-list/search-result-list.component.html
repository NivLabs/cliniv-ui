<div class="search-results" (scrolled)="scrolled.emit()">
    <div class="row">
        <div class="center" *ngIf="!loading && dataNotFound">
            <h1>{{emptyMessage}}</h1>
        </div>
        <div *ngFor="let item of items" [class]="itemColClass">
            <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
        </div>
    </div>
</div>
