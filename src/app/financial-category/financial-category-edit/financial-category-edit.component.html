<div class="card">
    <div class="card-header card-header-info">
        <h4 class="card-title">Dados da categoria financeira</h4>
        <p class="card-category">Dados completos da categoria financeira</p>
    </div>
    <div class="card-body">
        <mat-tab-group>
            <mat-tab label="Informações da Categoria *">
                <br />
                <form #form="ngForm" autocomplete="off">
                    <div class="row">
                        <div class="col-md-12">
                            <mat-form-field>
                                <input matInput placeholder="Descrição" name="description"
                                    [(ngModel)]="dataToForm.description" #description required />
                            </mat-form-field>
                        </div>
                    </div>
                    <app-dialog-form-actions [showNew]="!!dataToForm.id" newLabel="Nova Categoria"
                        newTooltip="Adiciona categoria financeira" [saveDisabled]="!form.valid" (new)="resetForm()"
                        (cancel)="onCancelClick()" (save)="save()"></app-dialog-form-actions>
                    <div class="clearfix"></div>
                </form>
            </mat-tab>
        </mat-tab-group>
    </div>
</div>
<app-loading [show]="loading"></app-loading>
