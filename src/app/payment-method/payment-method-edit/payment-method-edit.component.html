<div class="card">
    <div class="card-header card-header-info">
        <h4 class="card-title">Dados da forma de pagamento</h4>
        <p class="card-category">Dados completos da forma de pagamento</p>
    </div>
    <div class="card-body">
        <mat-tab-group>
            <mat-tab label="Informações da Forma de Pagamento *">
                <br />
                <form #form="ngForm" autocomplete="off">
                    <div class="row">
                        <div class="col-md-3">
                            <mat-form-field>
                                <input matInput placeholder="Código da forma de pagamento" name="id" [(ngModel)]="dataToForm.id" #id
                                    disabled />
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <mat-form-field>
                                <input matInput placeholder="Nome" name="name"
                                    [(ngModel)]="dataToForm.name" #name required />
                            </mat-form-field>
                        </div>
                    </div>
                    <app-dialog-form-actions [showNew]="!!dataToForm.id" newLabel="Nova Forma de Pagamento"
                        newTooltip="Adiciona forma de pagamento" [saveDisabled]="!form.valid" (new)="resetForm()"
                        (cancel)="onCancelClick()" (save)="save()"></app-dialog-form-actions>
                    <div class="clearfix"></div>
                </form>

            </mat-tab>
        </mat-tab-group>
    </div>
</div>
<app-loading [show]="loading"></app-loading>
