<div class="card">
    <div class="card-header card-header-info">
        <h4 class="card-title">Considerações do encerramento</h4>
        <p class="card-category">Preencha se necessário</p>
    </div>
    <div class="card-body">
        <form #form="ngForm" autocomplete="off">
            <div class="row">
                <div class="col-12">
                    <mat-form-field>
                            <textarea matInput
                                    cdkTextareaAutosize="true" 
                                    cdkAutosizeMinRows="15"
                                    [(ngModel)]="dataToForm.observations"
                                    [ngModelOptions]="{standalone: true}"></textarea>
                    </mat-form-field>
                </div>
            </div>

            <app-dialog-form-actions [saveDisabled]="!form.valid" (cancel)="onCancelClick()"
                (save)="save()"></app-dialog-form-actions>
            <div class="clearfix"></div>
        </form>
    </div>
</div>
<app-loading [show]="loading"></app-loading>
