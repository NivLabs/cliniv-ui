<div class="card">
    <div class="card-header card-header-info">
        <h4 class="card-title">Esqueci a senha</h4>
        <p class="card-category">Informe os dados abaixo para redefinir sua senha</p>
    </div>
    <div class="card-body">
        <form #form="ngForm" autocomplete="off" (ngSubmit)="forgotPassword()">
            <div class="row">
                <div class="col-md-12">
                    <mat-form-field>
                        <input matInput placeholder="Nome de usuário ou email" name="username"
                            [(ngModel)]="dataToForm.username" #username="ngModel" type="text" required />
                    </mat-form-field>
                </div>
                <div class="col-md-12">
                    <mat-form-field>
                        <input matInput placeholder="Nome completo da mãe" name="motherName"
                            [(ngModel)]="dataToForm.motherName" #motherName="ngModel" type="text" required />
                    </mat-form-field>
                </div>
                <div class="col-md-12">
                    <mat-form-field>
                        <input matInput placeholder="Data de nascimento" name="bornDate"
                            [(ngModel)]="dataToForm.bornDate" #bornDate="ngModel" type="date" required />
                    </mat-form-field>
                </div>
                <div class="col-md-12">
                    <mat-form-field>
                        <input matInput placeholder="Nova senha" name="newPassword"
                            [(ngModel)]="dataToForm.newPassword" #newPassword="ngModel" type="password" required />
                    </mat-form-field>
                </div>
                <div class="col-md-12">
                    <mat-form-field>
                        <input matInput placeholder="Confirmar nova senha" name="confirmNewPassword"
                            [(ngModel)]="confirmNewPassword" #confirmNewPasswordModel="ngModel" type="password" required />
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <button mat-raised-button type="submit" [disabled]="!form.valid || loading"
                    class="col-12 btn btn-success">{{loading ? 'Enviando...' : 'Confirmar'}}</button>
                <button mat-raised-button type="button" [disabled]="loading" (click)="onCancelClick()"
                    class="col-12 btn btn-danger" matTooltip="Fecha formulário"><span class="fa fa-close"></span>
                    Fechar</button>
                <div class="clearfix"></div>
            </div>
        </form>
    </div>
</div>
